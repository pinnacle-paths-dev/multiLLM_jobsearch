name: Multi-LLM role feed

on:
  schedule:
    # GitHub schedules are best-effort: runs can be delayed or dropped under
    # load (the first scheduled run, Thu 2026-11-26, never fired). So run twice,
    # early and off the busy top/quarter-hour minutes:
    #   09:07 UTC = 4:07am ET (winter) / 5:07am ET (summer)  - main run
    #   10:37 UTC = 5:37am ET (winter) / 6:37am ET (summer)  - backup
    # Each client task reads the NEWEST feed email, so a second email is harmless.
    - cron: "7 9 * * 1,4"
    - cron: "37 10 * * 1,4"
  workflow_dispatch:
    inputs:
      clients:
        description: "Client ids to run (space-separated, blank = all)"
        required: false
        default: ""

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_feed.py
      - name: Build and upload feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FEED_EMAIL_FROM: ${{ vars.FEED_EMAIL_FROM }}
          FEED_EMAIL_TO: ${{ vars.FEED_EMAIL_TO }}
          CLIENT_SPECS_JSON: ${{ secrets.CLIENT_SPECS_JSON }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          MUSE_MODEL: ${{ vars.MUSE_MODEL }}
        run: python feed.py ${{ github.event.inputs.clients }}
